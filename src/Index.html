<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
        <title>VxSync – [COMPANY_NAME]</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,<?!= faviconBase64 ?>" />
    <style>
      :root {
        /* Palette pulled from the VxSync logo: navy cloud outline,
           teal->green checkmark gradient. */
        --vx-navy: #16296b;
        --vx-navy-dark: #0f1c4a;
        --vx-teal: #1fb6a8;
        --vx-green: #3ec97a;
        --vx-bg: #f4f7fb;
        --vx-card: #ffffff;
        --vx-border: #e2e8f0;
        --vx-text: #1e2a3a;
        --vx-muted: #6b7a90;
      }
      * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
      body { margin: 0; background: var(--vx-bg); color: var(--vx-text); }

      /* ---- Shared brand header ---- */
      .brand-header {
        background: linear-gradient(90deg, var(--vx-navy) 0%, var(--vx-navy-dark) 100%);
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
      }
      .brand-header .vx-mark {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-header .vx-mark img { height: 44px; width: auto; }
      .brand-header .vx-mark .vx-title { color: #fff; font-size: 1.5em; font-weight: 700; line-height: 1.1; }
      .brand-header .vx-mark .vx-subtitle { color: #cdd8f0; font-size: 0.75em; font-weight: 400; }
      .brand-header .pq-mark {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        padding: 4px 12px 4px 8px;
        border-radius: 20px;
      }
      .brand-header .pq-mark img { height: 26px; width: auto; }
      .brand-header .pq-mark span { font-size: 0.72em; color: var(--vx-navy); font-weight: 600; white-space: nowrap; }

      /* ---- Tab switcher (Admin only) ---- */
      .tab-bar {
        display: flex;
        gap: 6px;
        background: #fff;
        padding: 8px 24px 0 24px;
        border-bottom: 1px solid var(--vx-border);
      }
      .tab-btn {
        border: none;
        background: transparent;
        padding: 10px 20px;
        font-weight: 600;
        color: var(--vx-muted);
        cursor: pointer;
        border-bottom: 3px solid transparent;
        font-size: 0.95em;
      }
      .tab-btn.active { color: var(--vx-navy); border-bottom-color: var(--vx-teal); }
      .tab-panel { display: none; }
      .tab-panel.active { display: block; }

      .user-pill {
        font-size: 0.72em;
        color: var(--vx-muted);
        padding: 8px 24px 0 24px;
        text-align: right;
      }
    </style>
  </head>

    <div class="user-pill"><?= userEmail ?> &middot; <?= role ?></div>

    <script>
      var VX_ROLE = '<?= role ?>';
    </script>

    <? if (role === 'Admin') { ?>
    <div class="tab-bar">
      <button class="tab-btn active" id="tabBtnEntry" onclick="vxShowTab('entry')">📝 Vaccination Entry</button>
      <button class="tab-btn" id="tabBtnDashboard" onclick="vxShowTab('dashboard')">📊 Program Dashboard</button>
    </div>
    <? } ?>

    <? if (role === 'Admin' || role === 'Encoder') { ?>
    <div id="entryPanel" class="tab-panel <?= role === 'Client' ? '' : 'active' ?>">
      <?!= include('EntryForm') ?>
    </div>
    <? } ?>

    <? if (role === 'Admin' || role === 'Client') { ?>
    <div id="dashboardPanel" class="tab-panel <?= role === 'Client' ? 'active' : '' ?>">
      <?!= include('Dashboard') ?>
    </div>
    <? } ?>

    <script>
      function vxShowTab(which) {
        var entry = document.getElementById('entryPanel');
        var dash = document.getElementById('dashboardPanel');
        var btnEntry = document.getElementById('tabBtnEntry');
        var btnDash = document.getElementById('tabBtnDashboard');
        if (which === 'entry') {
          if (entry) entry.classList.add('active');
          if (dash) dash.classList.remove('active');
          if (btnEntry) btnEntry.classList.add('active');
          if (btnDash) btnDash.classList.remove('active');
        } else {
          if (dash) dash.classList.add('active');
          if (entry) entry.classList.remove('active');
          if (btnDash) btnDash.classList.add('active');
          if (btnEntry) btnEntry.classList.remove('active');
          // Lazy-load dashboard data the first time it's shown.
          if (typeof vxLoadDashboard === 'function') vxLoadDashboard();
        }
      }
      // If only the dashboard panel exists (Client role), load immediately.
      document.addEventListener('DOMContentLoaded', function () {
        if (!document.getElementById('entryPanel') && document.getElementById('dashboardPanel')) {
          if (typeof vxLoadDashboard === 'function') vxLoadDashboard();
        }
      });
    </script>
